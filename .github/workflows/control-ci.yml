name: control-ci

on:
  pull_request:
  push:
    branches: [release/0.8.0]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install pytest ruff==0.15.17 build
      - run: ruff format --check mixle_mlops/control mixle_mlops/__init__.py tests/test_control_runtime.py tests/test_control_registry.py
      - run: ruff check mixle_mlops/control mixle_mlops/__init__.py tests/test_control_runtime.py tests/test_control_registry.py
      - run: pytest -q tests/test_control_runtime.py tests/test_control_registry.py tests/test_context_handoff.py
      - run: python -m build
