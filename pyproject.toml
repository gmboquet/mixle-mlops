[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixle-mlops"
version = "0.8.0.dev0"
description = "Operational control plane for durable Mixle jobs, artifacts, model serving, monitoring, promotion, and rollback."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Grant Boquet" }]
dependencies = [
    # mixle core (the model primitives + the probabilistic differentiator). Published on PyPI as `mixle`.
    "mixle>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",          # proxy to OpenAI-compatible LLM backends (vLLM / Ollama / llama.cpp / hosted)
    "sqlmodel>=0.0.16",     # accounts / keys / registry / conversations / feedback storage
    "python-multipart>=0.0.9",  # multimodal file uploads
    "pyjwt[crypto]>=2.8",   # OIDC id_token verification + Apple client-secret signing (Sign in with Google/Apple)
]

[project.optional-dependencies]
dev = ["ruff==0.15.17", "pytest>=8", "pytest-asyncio>=0.23", "fakeredis>=2", "moto[s3]>=5", "build>=1.2"]
documents = ["pypdf>=4", "python-docx>=1", "python-pptx>=0.6", "openpyxl>=3.1", "lasio>=0.31"]
                                                     # PDF/DOCX/PPTX ingestion + XLSX/LAS typed-table parsing
ocr = ["pytesseract>=0.3", "pdf2image>=1.16"]       # scanned-PDF OCR fallback (also needs the tesseract +
                                                     # poppler system binaries -- not installable via pip)
scale = ["redis>=5"]                                # shared cache + cross-replica rate limiting
export = ["reportlab>=4"]                           # PDF conversation export (json/markdown are stdlib)
datasets = ["pandas>=2", "pyarrow>=15"]             # parquet dataset export
structured = ["jsonschema>=4"]                      # constrained/structured-output validation (graceful fallback if absent)
local = ["torch>=2", "transformers>=4"]             # local logit-level engine: token-level PoE + grammar masking
cloud = ["psycopg[binary]>=3.1", "boto3>=1.34",     # managed Postgres + AWS
         "fsspec>=2023.1", "s3fs", "gcsfs", "adlfs", "ossfs"]   # unified object store: S3/GCS/Azure/OSS
mcp = ["mcp>=1.0"]                                   # MCP server/client (official SDK; minimal fallback otherwise)
raster = ["rasterio>=1.3", "pillow>=10"]            # large GeoTIFF/raster tiling for vision-model ingestion
ml = ["open-clip-torch>=2", "torch>=2", "pillow>=10"]  # OpenCLIP image embeddings (M6a); deterministic hash fallback otherwise
all = ["mixle-mlops[documents,ocr,scale,export,datasets,structured,local,cloud,mcp,raster,ml]"]

[project.scripts]
mixle-serve = "mixle_mlops.cli:serve"             # run the platform gateway
mixle-mlops = "mixle_mlops.cli:main"              # admin CLI (init-db, create-user, ...)
mixle-seed = "mixle_mlops.seed_registry:main"
mixle-drift-retrain = "mixle_mlops.drift_retrain:main"

[project.urls]
Homepage = "https://github.com/gmboquet/mixle-mlops"
Core = "https://github.com/gmboquet/mixle"

[tool.setuptools.packages.find]
include = ["mixle_mlops*"]

[tool.setuptools.package-data]
mixle_mlops = ["control_surface_manifest.json"]

[tool.ruff]
line-length = 118
