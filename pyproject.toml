[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixle-mlops"
version = "0.7.0"
description = "All-in-one AI platform: host mixle models + open LLMs behind one OpenAI-compatible gateway, with accounts, API keys, multimodal, MCP, a chat UI, and a principled (mixle-powered) RLHF feedback loop."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Grant Boquet" }]
dependencies = [
    # mixle core (the model primitives + the probabilistic differentiator). Published on PyPI as `mixle`.
    # Floor is 0.6.1: mixle.evolve, mixle.task(.calibrate/.density/.distill/.model), mixle.ops.product_of_experts,
    # and mixle.enumeration.AutoregressiveEnumerable (all imported by this package) do not exist before 0.6.1 --
    # mixle==0.6.0 raises ModuleNotFoundError on several of them. Verified by importing every top-level
    # `mixle.*` symbol this package uses against each published mixle release (0.6.0/0.6.1/0.6.2/0.7.0).
    "mixle>=0.6.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",          # proxy to OpenAI-compatible LLM backends (vLLM / Ollama / llama.cpp / hosted)
    "sqlmodel>=0.0.16",     # accounts / keys / registry / conversations / feedback storage
    "python-multipart>=0.0.9",  # multimodal file uploads
    "pyjwt[crypto]>=2.8",   # OIDC id_token verification + Apple client-secret signing (Sign in with Google/Apple)
    "fsspec>=2023.1",       # storage/objectstore.py's local (file://) filesystem backend -- needed even
                             # without the `cloud` extra; only the per-cloud drivers (s3fs/gcsfs/adlfs/ossfs)
                             # are cloud-only and stay in the `cloud` extra below.
]

[project.optional-dependencies]
dev = ["ruff==0.15.17", "pytest>=8", "pytest-asyncio>=0.23", "fakeredis>=2"]
documents = ["pypdf>=4", "python-docx>=1", "python-pptx>=0.6"]   # PDF/DOCX/PPTX ingestion for RAG
scale = ["redis>=5"]                                # shared cache + cross-replica rate limiting
export = ["reportlab>=4"]                           # PDF conversation export (json/markdown are stdlib)
datasets = ["pandas>=2", "pyarrow>=15"]             # parquet dataset export
structured = ["jsonschema>=4"]                      # constrained/structured-output validation (graceful fallback if absent)
local = ["torch>=2", "transformers>=4"]             # local logit-level engine: token-level PoE + grammar masking
cloud = ["psycopg[binary]>=3.1", "boto3>=1.34",     # managed Postgres + AWS
         "s3fs", "gcsfs", "adlfs", "ossfs"]         # per-cloud object store drivers (fsspec itself is a base dep)
mcp = ["mcp>=1.0"]                                   # MCP server/client (official SDK; minimal fallback otherwise)
all = ["mixle-mlops[documents,scale,export,datasets,structured,local,cloud,mcp]"]

[project.scripts]
mixle-serve = "mixle_mlops.cli:serve"             # run the platform gateway
mixle-mlops = "mixle_mlops.cli:main"              # admin CLI (init-db, create-user, ...)
mixle-seed = "mixle_mlops.seed_registry:main"
mixle-drift-retrain = "mixle_mlops.drift_retrain:main"

[project.urls]
Homepage = "https://github.com/gmboquet/mixle-mlops"
Core = "https://github.com/gmboquet/mixle"

[tool.setuptools.packages.find]
include = ["mixle_mlops*"]

[tool.ruff]
line-length = 118
